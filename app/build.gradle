plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pubgflash.gamebooster'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pubgflash.gamebooster'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '6.0'
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
